name: Deploy Profesiograma App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Type-check & build API ─────────────────────────────
  build-api:
    name: Build & Type-check API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install root deps
        run: npm ci
      - name: Install API deps
        working-directory: apps/api
        run: npm ci
      - name: Type-check
        working-directory: apps/api
        run: npx tsc --noEmit

  # ── 2. Deploy Worker ──────────────────────────────────────
  deploy-api:
    name: Deploy API → Cloudflare Workers
    runs-on: ubuntu-latest
    needs: build-api
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Install API deps
        working-directory: apps/api
        run: npm ci
      - name: Run D1 migrations
        working-directory: apps/api
        run: npx wrangler d1 migrations apply profesiograma-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        working-directory: apps/api
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ── 3. Deploy Frontend ────────────────────────────────────
  deploy-web:
    name: Deploy Web → Cloudflare Pages
    runs-on: ubuntu-latest
    needs: deploy-api
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Install Web deps
        working-directory: apps/web
        run: npm ci
      - name: Build Web
        working-directory: apps/web
        run: npm run build
        env:
          VITE_API_URL: https://profesiograma-api.workers.dev/api
      - name: Deploy to Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=profesiograma
