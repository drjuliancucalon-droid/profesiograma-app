name                = "profesiograma-api"
main                = "src/index.ts"
compatibility_date  = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# ── Variables de entorno (secretos reales via `wrangler secret put`) ──
[vars]
ENVIRONMENT  = "production"
CORS_ORIGIN  = "https://profesiograma.pages.dev"
# JWT_SECRET y GEMINI_API_KEY se gestionan como secrets:
#   wrangler secret put JWT_SECRET
#   wrangler secret put GEMINI_API_KEY

# ── D1 Database ───────────────────────────────────────────────
[[d1_databases]]
binding       = "DB"
database_name = "profesiograma-db"
database_id   = "REPLACE_WITH_YOUR_D1_ID"
migrations_dir = "migrations"

# ── Browser Rendering (Puppeteer PDF) ────────────────────────
[browser]
binding = "BROWSER"

# ── R2 (assets opcionales) ───────────────────────────────────
[[r2_buckets]]
binding     = "ASSETS"
bucket_name = "profesiograma-assets"

# ── Rutas ────────────────────────────────────────────────────
# Descomenta y reemplaza con tu dominio real si usas Custom Domain:
# [[routes]]
# pattern  = "api.tudominio.com/*"
# zone_name = "tudominio.com"
