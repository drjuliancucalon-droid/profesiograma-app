name = "profesiograma-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
JWT_SECRET = "CHANGE_ME_IN_CLOUDFLARE_DASHBOARD"
GEMINI_API_KEY = "CHANGE_ME_IN_CLOUDFLARE_DASHBOARD"
FRONTEND_URL = "https://profesiograma.pages.dev"

[[d1_databases]]
binding = "DB"
database_name = "profesiograma-db"
database_id = "REPLACE_WITH_YOUR_D1_ID"

[build]
command = "npm run build"

[[routes]]
pattern = "profesiograma-api.TUDOMINIO.workers.dev/*"
zone_name = "TUDOMINIO.workers.dev"
